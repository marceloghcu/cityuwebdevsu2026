<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f5f7ff, #eef2ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1d1d1f;
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      width: 360px;
      padding: 32px 28px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6e6e73;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #424245;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #0071e3, #005ecf);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 25px rgba(0, 113, 227, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0, 113, 227, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign In</h2>
    <p class="subtitle">Welcome back. Please enter your credentials.</p>

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="username" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="password" />

    <button onclick="login()">Log In</button>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`http://127.0.0.1:5000/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
        const result = await response.text();
        alert(result === 'valid' ? 'Valid' : 'Invalid');
      } catch (error) {
        alert('Unable to reach login server');
      }
    }
  </script>
</body>
</html>
