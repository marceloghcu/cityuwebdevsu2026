<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #2575fc;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5ed8;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <label for="user">Username</label>
        <input type="text" placeholder="Enter username" id="user">

        <label for="pass">Password</label>
        <input type="password" placeholder="Enter password" id="pass">

        <button type="button" onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            const username = document.getElementById('user').value.trim();
            const password = document.getElementById('pass').value.trim();

            const url = new URL('http://127.0.0.1:5000/login');
            url.searchParams.set('username', username);
            url.searchParams.set('password', password);

            fetch(url)
                .then(response => response.text())
                .then(result => {
                    alert(result.toUpperCase());
                })
                .catch(error => {
                    console.error(error);
                    alert('LOGIN FAILED');
                });
        }
    </script>
</body>
</html>
