<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 420px;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 48px;
            color: #333;
        }

        label {
            font-size: 15px;
            color: #555;
            font-weight: bold;
        }

        .input-box {
            margin-top: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center;
            padding-bottom: 10px;
        }

        .icon {
            font-size: 22px;
            margin-right: 10px;
        }

        input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 18px;
        }

        .forgot {
            text-align: right;
            margin-top: -15px;
            margin-bottom: 35px;
            color: #666;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(to right, #44d8c7, #a43cff);
        }

        button:hover {
            opacity: .9;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <label>Username</label>

        <div class="input-box">
            <span class="icon">👤</span>
            <input id="user" type="text" placeholder="Type your username">
        </div>

        <label>Password</label>

        <div class="input-box">
            <span class="icon">🔒</span>
            <input id="password" type="password" placeholder="Type your password">
        </div>

        <div class="forgot">
            Forgot password?
        </div>

        <button onclick="login()">LOGIN</button>

    </div>

    <script>

        function login() {

            let user = document.getElementById("user").value;
            let password = document.getElementById("password").value;

            if (user == "user1" && password == "123456") {
                alert("Login Success!");
            }
            else {
                alert("Username or Password is incorrect.");
            }

        }

    </script>

</body>

</html>
