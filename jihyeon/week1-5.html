<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Age Calculator</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#ececec;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#59596f;
    border-radius:35px;
    padding:35px;
    color:white;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.container:before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    left:-70px;
    top:-60px;
}

.container:after{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.04);
    right:-100px;
    bottom:-100px;
}

.container>*{
    position:relative;
    z-index:1;
}

h1{
    font-size:58px;
    margin-bottom:20px;
}

.label{
    margin-top:15px;
    margin-bottom:8px;
    font-size:18px;
}

.input-box{
    border:3px solid white;
    border-radius:35px;
    padding:10px 20px;
}

input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    text-align:center;
    font-size:28px;
}

input::placeholder{
    color:#ddd;
}

.result{
    margin-top:35px;
    display:flex;
    justify-content:space-between;
}

.item{
    width:100px;
}

.circle{
    width:90px;
    height:90px;
    border:3px solid white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:36px;
    margin:auto;
}

.item p{
    margin-top:10px;
    font-size:18px;
}

/* Flatpickr 꾸미기 */

.flatpickr-calendar{
    border-radius:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>AGE</h1>

<div class="label">TODAY'S DATE</div>

<div class="input-box">
<input id="today" placeholder="00-00-0000" readonly>
</div>

<div class="label">YOUR BIRTHDAY</div>

<div class="input-box">
<input id="birthday" placeholder="00-00-0000" readonly>
</div>

<div class="result">

<div class="item">
<div class="circle" id="years">0</div>
<p>Years</p>
</div>

<div class="item">
<div class="circle" id="months">0</div>
<p>Months</p>
</div>

<div class="item">
<div class="circle" id="days">0</div>
<p>Days</p>
</div>

</div>

</div>

<script>

const todayPicker = flatpickr("#today",{
    dateFormat:"d-m-Y",
    defaultDate:new Date(),
    onChange:calculateAge
});

const birthdayPicker = flatpickr("#birthday",{
    dateFormat:"d-m-Y",
    onChange:calculateAge
});

function calculateAge(){

    if(!todayPicker.selectedDates.length || !birthdayPicker.selectedDates.length){
        return;
    }

    let today=todayPicker.selectedDates[0];
    let birth=birthdayPicker.selectedDates[0];

    if(birth>today){
        alert("Birthday cannot be later than today.");
        birthdayPicker.clear();
        return;
    }

    let years=today.getFullYear()-birth.getFullYear();
    let months=today.getMonth()-birth.getMonth();
    let days=today.getDate()-birth.getDate();

    if(days<0){
        months--;
        let prevMonth=new Date(today.getFullYear(),today.getMonth(),0);
        days+=prevMonth.getDate();
    }

    if(months<0){
        years--;
        months+=12;
    }

    document.getElementById("years").innerHTML=years;
    document.getElementById("months").innerHTML=months;
    document.getElementById("days").innerHTML=days;

}

</script>

</body>
</html>
